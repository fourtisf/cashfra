# Cashfra — nginx server block for a VPS.
# Certificates from certbot: certbot --nginx -d cashfra.com

server {
    listen 80;
    listen [::]:80;
    server_name cashfra.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cashfra.com;

    ssl_certificate     /etc/letsencrypt/live/cashfra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cashfra.com/privkey.pem;

    root  /var/www/cashfra;
    index index.html;

    add_header X-Robots-Tag        "noindex, nofollow, noarchive, nosnippet" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy     "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/html application/javascript application/json application/manifest+json;

    # the shell and the worker always revalidate so a deploy lands immediately
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }
    location ~* \.(html|json|webmanifest)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location ~* \.(png|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # never serve the repo's own files
    location ~ /\.(git|ht)            { deny all; }
    location ~* \.(md|sh|py|mjs)$     { deny all; }
    location ~ ^/(test|deploy)(/|$)   { deny all; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
