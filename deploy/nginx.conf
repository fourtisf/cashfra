# Cashfra — nginx site for cashfra.com on a VPS.
#
# Install it as /etc/nginx/sites-available/cashfra, symlink it into
# sites-enabled, then let certbot add TLS:
#
#     certbot --nginx -d cashfra.com -d www.cashfra.com
#
# This file is deliberately HTTP-only: certbot rewrites it in place, adding
# the 443 block, the certificate paths and the http->https redirect, and it
# keeps every location and header below. A config that named certificate
# files before they existed would simply refuse to start.
#
# deploy/vps-setup.sh does all of this for you.

server {
    listen 80;
    listen [::]:80;
    server_name cashfra.com www.cashfra.com;

    root  /var/www/cashfra;
    index index.html;

    # a private ledger has no business in a search index
    add_header X-Robots-Tag        "noindex, nofollow, noarchive, nosnippet" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy     "no-referrer" always;

    gzip on;
    gzip_types text/html application/javascript application/json application/manifest+json image/svg+xml;

    # The shell is served cache-first by the service worker, so the worker and
    # the HTML must always revalidate — without this the browser holds a stale
    # sw.js and no future deploy ever reaches an installed phone.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }
    location ~* \.(html|json|webmanifest)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Robots-Tag  "noindex, nofollow, noarchive, nosnippet" always;
    }
    # icons never change without a new filename
    location ~* \.(png|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # nothing from the repo is ever served
    location ~ /\.(git|ht)          { deny all; }
    location ~* \.(md|sh|ps1|py|mjs)$ { deny all; }
    location ~ ^/(test|deploy)(/|$) { deny all; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
